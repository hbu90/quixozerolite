[tool.poetry]
name = "quixozerolite"
version = "0.1.0"
description = ""
authors = ["hbu90 <76783951+hbu90@users.noreply.github.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,<3.12"
numpy = "<2"
tqdm = "^4.67.3"
pygame = "^2.6.1"
charset-normalizer = "^3.4.5"
